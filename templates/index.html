<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Residential Electrical Apprentice Screening Test – Live Grok AI Grading</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --border: #2d3a4f;
  --text: #e7ecf3;
  --muted: #8b9bb4;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}
.container { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
header {
  text-align: center;
  padding: 32px 16px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
header h1 { font-size: 1.55rem; font-weight: 700; margin-bottom: 6px; }
header p { color: var(--muted); font-size: 0.95rem; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 18px;
}
.card h2 { font-size: 1.15rem; margin-bottom: 14px; }
label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 5px; }
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
  margin-bottom: 14px;
}
textarea { min-height: 110px; resize: vertical; }
.btn {
  display: inline-block;
  padding: 12px 22px;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { display: block; width: 100%; text-align: center; }
.screen { display: none; }
.screen.active { display: block; }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  margin-bottom: 18px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.25s;
}
.q-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
.q-text { font-size: 1.02rem; margin-bottom: 14px; white-space: pre-wrap; }
.nav-btns { display: flex; gap: 10px; margin-top: 18px; }
.nav-btns .btn { flex: 1; }
.result-header {
  text-align: center;
  padding: 28px 16px;
  background: var(--card);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
}
.level-badge {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 18px;
  background: var(--accent);
  border-radius: 20px;
  font-weight: 700;
  font-size: 1.05rem;
}
.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.score-card {
  background: var(--bg);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.score-card .label { font-size: 0.78rem; color: var(--muted); }
.score-card .value { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
.rec-box {
  background: var(--bg);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 0 8px 8px 0;
}
.rec-box.warn { border-left-color: var(--warning); }
.red-flag {
  background: rgba(239,68,68,0.12);
  border: 1px solid var(--danger);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 8px 0;
  color: #fca5a5;
}
ul { padding-left: 20px; }
li { margin-bottom: 6px; }
.year-select-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 16px 0;
}
.year-btn {
  padding: 18px;
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.year-btn:hover, .year-btn.selected {
  border-color: var(--accent);
  background: rgba(59,130,246,0.12);
}
@media (max-width: 560px) {
  .year-select-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Residential Electrical Apprentice Screening Test</h1>
    <p>2023 NEC Edition • Practical Field Assessment • Live Grok AI Grading</p>
  </header>

  <!-- SCREEN 0: Applicant Info + Year Selection -->
  <div id="screen-info" class="screen active">
    <div class="card">
      <h2>Applicant Information</h2>
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name">
      <label>Years of Experience Claimed</label>
      <input type="text" id="years" placeholder="e.g. 1.5 years">
      <label>Previous Experience / Employers (brief)</label>
      <textarea id="experience" placeholder="Briefly describe your electrical experience..."></textarea>
    </div>
    <div class="card">
      <h2>Which year level are you claiming?</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:12px;">Select the apprenticeship year that matches your experience. The test will be scored against that level.</p>
      <div class="year-select-grid">
        <button class="year-btn" data-year="1" onclick="selectYear(1)">Year 1 Apprentice</button>
        <button class="year-btn" data-year="2" onclick="selectYear(2)">Year 2 Apprentice</button>
        <button class="year-btn" data-year="3" onclick="selectYear(3)">Year 3 Apprentice</button>
        <button class="year-btn" data-year="4" onclick="selectYear(4)">Year 4 Apprentice</button>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="startTest()">Start Test</button>
    </div>
  </div>

  <!-- SCREEN 1: Questions -->
  <div id="screen-test" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="card">
      <div class="q-meta" id="qMeta"></div>
      <div class="q-text" id="qText"></div>
      <textarea id="answerBox" placeholder="Type your answer here. Explain your reasoning clearly."></textarea>
      <div class="nav-btns">
        <button class="btn btn-secondary" id="btnPrev" onclick="prevQ()">← Previous</button>
        <button class="btn btn-primary" id="btnNext" onclick="nextQ()">Next →</button>
      </div>
      <button class="btn btn-danger btn-block" style="margin-top:14px;display:none;" id="btnSubmit" onclick="submitTest()">Submit for Grok AI Grading</button>
    </div>
  </div>

  <!-- SCREEN 2: Results -->
  <div id="screen-results" class="screen">
    <div id="resultsContent"></div>
    <div style="text-align:center;margin-top:20px;">
      <button class="btn btn-secondary" onclick="window.print()">Print / Save as PDF</button>
      <button class="btn btn-secondary" onclick="downloadJSON()" style="margin-left:8px;">Download JSON</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = {

    {id:"Y1-12", section:"Yes/No", text:"Different wire sizes are used for different circuit ampacities (e.g., 14 AWG for 15 A, 12 AWG for 20 A under normal conditions). (Yes/No)"},
    {id:"Y1-13", section:"Yes/No", text:"A device box must be large enough for the number of conductors, devices, and clamps it contains (box fill). (Yes/No)"},

    {id:"Y1-15", section:"Yes/No", text:"A breaker protects the conductors and equipment from overcurrent; it does not primarily protect people from shock. (Yes/No)"},
    {id:"Y1-16", section:"Multiple Choice", text:"Which tool is the proper instrument to verify that a circuit is de-energized before working on it?\\n\\nA. Continuity tester\\nB. Non-contact voltage tester or multimeter rated for the voltage\\nC. Clamp meter only\\nD. Neon test light only"},
    {id:"Y1-17", section:"Multiple Choice", text:"On a standard 120 V duplex receptacle, the taller slot is the:\\n\\nA. Hot\\nB. Neutral\\nC. Ground\\nD. Travelers"},
    {id:"Y1-18", section:"Multiple Choice", text:"When stripping NM-B cable, the outer jacket should be removed carefully so that:\\n\\nA. The insulation on the individual conductors is not nicked\\nB. The ground wire is cut short\\nC. The cable can be forced into a tight box\\nD. The jacket is left long inside the box"},
    {id:"Y1-19", section:"Multiple Choice", text:"A common residential lighting circuit is typically protected by a:\\n\\nA. 30 A breaker and 10 AWG copper\\nB. 15 A or 20 A breaker with appropriate conductor size\\nC. 50 A breaker\\nD. Fuse only"},
    {id:"Y1-20", section:"Multiple Choice", text:"The purpose of an equipment grounding conductor is to:\\n\\nA. Carry normal load current\\nB. Provide a low-impedance path for fault current so the overcurrent device can clear the fault\\nC. Serve as a neutral\\nD. Reduce voltage drop"},
    {id:"Y1-21", section:"Multiple Choice", text:"When connecting wires under a screw terminal on a receptacle or switch:\\n\\nA. The wire should be looped clockwise so tightening the screw pulls the wire in\\nB. The wire can be left straight under the screw\\nC. Multiple wires under one screw are always preferred\\nD. Insulation should be left under the screw head"},
    {id:"Y1-22", section:"Multiple Choice", text:"A single-pole switch typically interrupts the:\\n\\nA. Neutral conductor\\nB. Hot (ungrounded) conductor\\nC. Equipment grounding conductor\\nD. Both hot and neutral"},
    {id:"Y1-23", section:"Multiple Choice", text:"Before installing a new receptacle in an existing box, you should:\\n\\nA. Assume the circuit is dead\\nB. Test for voltage and identify the conductors\\nC. Immediately cut all wires\\nD. Rely on the panel schedule only"},
    {id:"Y1-24", section:"Multiple Choice", text:"Which of the following is an unsafe condition that a Year 1 apprentice should recognize and report?\\n\\nA. Missing or damaged receptacle cover plates\\nB. Open junction boxes with exposed splices\\nC. Overloaded or double-tapped breakers\\nD. All of the above"},
    {id:"Y1-25", section:"Multiple Choice", text:"Proper use of a voltage tester includes:\\n\\nA. Testing the tester on a known live source before and after testing the circuit\\nB. Using any tester regardless of voltage rating\\nC. Testing only once\\nD. Relying solely on a non-contact tester without confirmation"},

    {id:"Y2-17", section:"Multiple Choice", text:"Kitchen countertop receptacles in a dwelling are generally required to be supplied by:\\n\\nA. At least two 20 A small-appliance branch circuits\\nB. One 15 A circuit\\nC. Any available circuit\\nD. Lighting circuits only"},

let claimedYear = null;
let currentQ = 0;
let answers = {};
let applicantInfo = {};
let currentQuestions = [];

function selectYear(y) {
  claimedYear = y;
  document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.year-btn[data-year="${y}"]`).classList.add('selected');
}

function startTest() {
  const name = document.getElementById('name').value.trim();
  if (!name) { alert('Please enter your name.'); return; }
  if (!claimedYear) { alert('Please select a year level.'); return; }

  applicantInfo = {
    name: name,
    years: document.getElementById('years').value.trim(),
    experience: document.getElementById('experience').value.trim()
  };
  currentQuestions = QUESTIONS[claimedYear];
  currentQ = 0;
  answers = {};

  document.getElementById('screen-info').classList.remove('active');
  document.getElementById('screen-test').classList.add('active');
  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentQ];
  document.getElementById('qMeta').textContent = `Year ${claimedYear} • Question ${currentQ + 1} of ${currentQuestions.length} • ${q.section}`;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('answerBox').value = answers[q.id] || '';
  document.getElementById('progressFill').style.width = ((currentQ + 1) / currentQuestions.length * 100) + '%';

  document.getElementById('btnPrev').style.display = currentQ === 0 ? 'none' : 'inline-block';
  document.getElementById('btnNext').style.display = currentQ === currentQuestions.length - 1 ? 'none' : 'inline-block';
  document.getElementById('btnSubmit').style.display = currentQ === currentQuestions.length - 1 ? 'block' : 'none';
}

function saveCurrentAnswer() {
  const q = currentQuestions[currentQ];
  answers[q.id] = document.getElementById('answerBox').value;
}

function nextQ() {
  saveCurrentAnswer();
  if (currentQ < currentQuestions.length - 1) {
    currentQ++;
    showQuestion();
  }
}

function prevQ() {
  saveCurrentAnswer();
  if (currentQ > 0) {
    currentQ--;
    showQuestion();
  }
}

function submitTest() {
  if (!confirm('Submit the test for live Grok AI grading? You will not be able to change answers after this.')) return;
  saveCurrentAnswer();

  const answerList = currentQuestions.map(q => ({
    id: q.id,
    year: claimedYear,
    section: q.section,
    question: q.text,
    answer: answers[q.id] || ""
  }));

  const payload = {
    applicant: applicantInfo,
    answers: answerList,
    claimed_year: claimedYear
  };

  document.getElementById('screen-test').classList.remove('active');
  document.getElementById('screen-results').classList.add('active');
  document.getElementById('resultsContent').innerHTML = `
    <div class="card" style="text-align:center;padding:60px 20px;">
      <h2>Grok is evaluating your answers...</h2>
      <p style="color:var(--muted);margin-top:12px;">This usually takes 20–60 seconds. Please do not close this page.</p>
      <div style="margin-top:24px;font-size:2rem;">⏳</div>
    </div>
  `;

  fetch('/api/grade', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(async res => {
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Grading request failed');
    }
    return res.json();
  })
  .then(grade => {
    showAIResults(grade);
  })
  .catch(err => {
    document.getElementById('resultsContent').innerHTML = `
      <div class="card" style="border-color:var(--danger);">
        <h2 style="color:var(--danger);">Grading Error</h2>
        <p>${err.message}</p>
        <p style="margin-top:12px;font-size:0.9rem;color:var(--muted);">Please contact the hiring manager or try again later.</p>
        <button class="btn btn-secondary" onclick="location.reload()" style="margin-top:16px;">Start Over</button>
      </div>
    `;
  });
}

function showAIResults(grade) {
  const cat = grade.category_scores || {};
  const strengths = (grade.strengths || []).map(s => `<li>${s}</li>`).join('');
  const weaknesses = (grade.weaknesses || []).map(w => `<li>${w}</li>`).join('');
  const flags = (grade.red_flags || []).map(f => `<div class="red-flag">${f}</div>`).join('');

  const html = `
    <div class="result-header">
      <h2>${applicantInfo.name || 'Candidate'}</h2>
      <div>Live Grok AI Evaluation Complete</div>
      <div class="level-badge">${grade.level || '—'}</div>
      <div style="margin-top:12px;font-size:1.1rem;">Overall Score: <strong>${grade.overall_score_percent ?? '—'}%</strong></div>
    </div>

    <div class="card">
      <h2>Recommended Classification</h2>
      <p><strong>Level:</strong> ${grade.level || '—'}</p>
      <p style="margin:8px 0;">${grade.level_description || ''}</p>
      <p><strong>Claimed Year:</strong> Year ${grade.claimed_year || claimedYear} • <strong>Match:</strong> ${grade.experience_match || '—'}</p>
      <div class="rec-box">
        <strong>Suggested Pay Grade Band:</strong><br>${grade.pay_grade_band || '—'}
      </div>
      <div class="rec-box">
        <strong>Recommended Project Placement:</strong><br>${grade.project_placement || '—'}
      </div>
    </div>

    <div class="card">
      <h2>Category Scores</h2>
      <div class="score-grid">
        <div class="score-card"><div class="label">Safety</div><div class="value">${cat.safety ?? '—'}%</div></div>
        <div class="score-card"><div class="label">Fundamentals</div><div class="value">${cat.fundamentals ?? '—'}%</div></div>
        <div class="score-card"><div class="label">Installation</div><div class="value">${cat.installation ?? '—'}%</div></div>
        <div class="score-card"><div class="label">Troubleshooting</div><div class="value">${cat.troubleshooting ?? '—'}%</div></div>
        <div class="score-card"><div class="label">NEC Knowledge</div><div class="value">${cat.nec ?? '—'}%</div></div>
        <div class="score-card"><div class="label">Field Judgment</div><div class="value">${cat.field_judgment ?? '—'}%</div></div>
        <div class="score-card"><div class="label">Limitations / Asking</div><div class="value">${cat.limitations ?? '—'}%</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Strengths</h2>
      <ul>${strengths || '<li>None listed</li>'}</ul>
    </div>

    <div class="card">
      <h2>Areas for Development</h2>
      <ul>${weaknesses || '<li>None listed</li>'}</ul>
    </div>

    ${flags ? `<div class="card"><h2 style="color:var(--danger);">Red Flags</h2>${flags}</div>` : ''}

    <div class="card">
      <h2>Hiring Manager Summary</h2>
      <p>${grade.summary_for_hiring_manager || '—'}</p>
    </div>

    <div class="card" style="background:#151c27;">
      <h2>Applicant Profile</h2>
      <p><strong>Claimed Experience:</strong> ${applicantInfo.years || '—'}</p>
      <p><strong>Background:</strong> ${applicantInfo.experience || '—'}</p>
      <p><strong>Graded by:</strong> ${grade._meta?.model || 'Grok'} at ${grade._meta?.graded_at || '—'}</p>
    </div>
  `;
  document.getElementById('resultsContent').innerHTML = html;
  window.scrollTo(0, 0);
  localStorage.setItem('apprenticeTestAIResult_' + (applicantInfo.name || 'candidate'), JSON.stringify({ applicantInfo, grade, claimedYear }));
}

function downloadJSON() {
  const data = localStorage.getItem('apprenticeTestAIResult_' + (applicantInfo.name || 'candidate'));
  if (!data) { alert('No results found'); return; }
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Apprentice_AI_Result_${(applicantInfo.name || 'candidate').replace(/\\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
